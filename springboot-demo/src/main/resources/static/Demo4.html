<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            padding: 20px 0;
        }

        p {
            color: #666;
            text-align: center;
            font-size: 14px;
            padding: 10px 0;
        }

        .row {
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        span {
            width: 100px;
            line-height: 4px;
        }

        .edit {
            width: 200px;
            height: 30px;
        }

        .submit {
            width: 304px;
            height: 40px;
            color: white;
            background-color: orange;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>表白墙</h1>
        <p>输入后点击提交，会将信息显示在表格中</p>

        <div class="row">
            <span>谁：</span>
            <input type="text" id="from"  class="edit">
        </div>
        <div class="row">
            <span>对谁：</span>
            <input type="text" id="to" class="edit">
        </div>
        <div class="row">
            <span>说什么：</span>
            <input type="text" id="say" class="edit">
        </div>
        <div class="row">
            <input type="button" class="submit" value="提交">
        </div>
        
    </div>

    <script src="../../../../../../前端代码/js/jquery-4.1.0.min.js"></script>
    <script>
        $(".submit").click(function() {
            let from = $("#from").val();
            let to = $("#to").val();
            let say = $("#say").val();

            if(from==null || to==null || say==null){
                return;
            }

            let html = "<div class='row'>" + from + "对" + to + "说：" + say + "</div>";
            $(".container").append(html);

            $(":text").val("");

        });
    </script>
</body>
</html>
